<!DOCTYPE html>
<html>
    <head>
        <title>4 SEASONS</title>
        <link rel="stylesheet" href="style.css">

        <!-- google fonts -->
         <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <section id="shapeandlines">
            <div class="lovers">
                <h2 class="cline1">i like your sweater</h2>
                <h2 class="cline2">i saved you a seat</h2>
                <h2 class="cline3">how was your day?</h2>
                <h2 class="cline4">take care</h2>
                <div class="circle"></div>
            </div>
            <div class="lovers">
                <h2 class="tline1">I like your dress</h2>
                <h2 class="tline2">can I sit next to you?
                </h2>
                <h2 class="tline3">I missed you
                </h2>
                <h2 class="tline4">will I see you again?</h2>
                <div class="triangle"></div>
            </div>
        </section>

        <section id="vital">
            <div class="heartbeat"></div>
        </section>

        <section id="instruction">
                <p class="instruction1">make them close</p>
                <p class="instruction2">closer</p>
                <p class="instruction3">closer !!</p>
                <p class="instruction4">there is a lot of intimacy in never speaking again</p>
        </section>



    </body>
</html>
